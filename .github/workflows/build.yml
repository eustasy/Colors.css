name: Build CSS and data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: ["data/*", "utils/*"]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.8
      uses: actions/setup-python@v7
      with:
        python-version: 3.8
    - name: Build CSS from data
      run: python utils/generator.py
    - name: Build index data from data
      run: python utils/data.py
    - name: Commit changes
      run: |
        git remote set-url origin https://x-access-token:"$GITHUB_TOKEN"@github.com/"$GITHUB_REPOSITORY".git
        git config --global user.email "actions@github.com"
        git config --global user.name "actions"
        git checkout main
        git add .
        if git commit -m "Automatic build from data"; then
          git push --set-upstream origin main
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
