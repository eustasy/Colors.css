# eustasy/.Normal 4.0beta13
name: "Test: Python"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "setup.cfg"
      - "tox.ini"
      - ".github/workflows/test-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "setup.cfg"
      - "tox.ini"
      - ".github/workflows/test-python.yml"

permissions:
  contents: read

jobs:
  test-python:
    # Remove the `if: false` below to activate this workflow.
    if: false
    name: pytest + coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/python/setup@v4
        with:
          python-version: ${{ matrix.python-version }}
          install-command: pip install -r requirements.txt

      # Insert project-specific steps here — fixtures, config files, migrations.

      - uses: eustasy/.normal/python/test@v4
        with:
          coverage-token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          upload: ${{ matrix.python-version == '3.13' }}
